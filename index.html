<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>동물상 테스트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>동물상 테스트</h1>
        <p>얼굴 사진을 업로드하여 어떤 동물상인지 확인해보세요!</p>
        
        <div class="upload-container">
            <input type="file" id="image-upload" accept="image/*">
            <label for="image-upload" class="upload-label">이미지 선택</label>
        </div>

        <div id="image-preview-container" class="image-preview"></div>
        <div id="label-container"></div>
        
        <div class="model-notice">
            <strong>참고:</strong> 이 앱이 작동하려면, 'my_model' 폴더에 Teachable Machine에서 내보낸 <code>model.json</code> 및 <code>metadata.json</code> 파일이 있어야 합니다.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <script type="text/javascript">
        const URL = "./my_model/";
        let model, labelContainer, maxPredictions;

        const imageUpload = document.getElementById("image-upload");
        const imagePreviewContainer = document.getElementById("image-preview-container");

        imageUpload.addEventListener("change", async (event) => {
            if (event.target.files && event.target.files[0]) {
                const imageFile = event.target.files[0];
                const image = document.createElement("img");
                image.src = URL.createObjectURL(imageFile);
                image.onload = async () => {
                    imagePreviewContainer.innerHTML = ''; // Clear previous image
                    imagePreviewContainer.appendChild(image);
                    
                    // Initialize and predict
                    await initAndPredict(image);
                };
            }
        });

        async function initAndPredict(imageElement) {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            try {
                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                labelContainer = document.getElementById("label-container");
                labelContainer.innerHTML = ''; // Clear previous labels
                for (let i = 0; i < maxPredictions; i++) {
                    labelContainer.appendChild(document.createElement("div"));
                }
                
                await predict(imageElement);

            } catch (error) {
                console.error("Error loading or running the model:", error);
                labelContainer.innerHTML = "모델을 로드하는 데 실패했습니다. 'my_model' 폴더에 파일이 올바르게 있는지 확인하세요.";
            }
        }

        async function predict(imageElement) {
            const prediction = await model.predict(imageElement);
            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction =
                    prediction[i].className + ": " + prediction[i].probability.toFixed(2);
                labelContainer.childNodes[i].innerHTML = classPrediction;
            }
        }
    </script>
</body>
</html>
