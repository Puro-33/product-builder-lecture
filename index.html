<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Food Image Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
    <main class="app">
        <button id="theme-toggle-btn" class="theme-toggle">🌙</button>
        <h1>AI Food Image Generator</h1>
        <p>Enter a food name to "generate" an image!</p>
        
        <div class="input-container">
            <input type="text" id="food-input" placeholder="e.g., Pizza, Sushi, Banana...">
            <button id="generate-btn" class="generate-button">Generate Image</button>
        </div>

        <div id="image-container" class="image-container">
            <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
            <img id="food-image" src="" alt="Generated food image" style="display: none;">
        </div>

        <section class="contact-form-section">
            <h2>Partnership Inquiry</h2>
            <form action="https://formspree.io/f/xdaandjj" method="POST">
                <div class="form-group">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <button type="submit" class="generate-button">Send Inquiry</button>
            </form>
        </section>

        <section class="comments-section">
            <h2>Comments</h2>
            <div id="disqus_thread"></div>
            <script>
                /**
                *  RECOMMENDED CONFIGURATION VARIABLES: EDIT AND UNCOMMENT THE SECTION BELOW TO INSERT DYNAMIC VALUES FROM YOUR PLATFORM OR CMS.
                *  LEARN WHY DEFINING THESE VARIABLES IS IMPORTANT: https://disqus.com/admin/universalcode/#configuration-variables    */
                /*
                var disqus_config = function () {
                this.page.url = PAGE_URL;  // Replace PAGE_URL with your page's canonical URL variable
                this.page.identifier = PAGE_IDENTIFIER; // Replace PAGE_IDENTIFIER with your page's unique identifier variable
                };
                */
                (function() { // DON'T EDIT BELOW THIS LINE
                    var d = document, s = d.createElement('script');
                    s.src = 'https://gemini-test-comments.disqus.com/embed.js'; // IMPORTANT: Replace 'gemini-test-comments' with your actual Disqus shortname!
                    s.setAttribute('data-timestamp', +new Date());
                    (d.head || d.body).appendChild(s);
                })();
            </script>
            <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
        </section>
    </main>
    <script src="main.js" type="module"></script>
</body>
</html>
